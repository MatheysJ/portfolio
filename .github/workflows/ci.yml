name: CI

# Só valida. O deploy é feito pela integração Workers Builds da Cloudflare
# (worker "portfolio"), que builda e publica a partir dos pushes.
# Este workflow não usa credenciais da Cloudflare e não faz deploy.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:ci

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  lighthouse:
    name: Build e Lighthouse (critério de DONE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn build

      # Falha o pipeline se performance, acessibilidade, boas práticas ou SEO
      # ficarem abaixo de 90 (metas em lighthouserc.json).
      - run: yarn lighthouse

      - name: Publicar relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  worker:
    name: Build do Worker (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile --non-interactive

      - name: Build com OpenNext (o mesmo artefato que a Cloudflare publica)
        run: yarn opennextjs-cloudflare build

      - name: Validar o Worker com Wrangler (dry-run, sem deploy)
        run: yarn wrangler deploy --dry-run --outdir .wrangler/dry-run
