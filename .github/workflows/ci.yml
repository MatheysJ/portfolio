name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  lighthouse:
    name: Build e Lighthouse (critério de DONE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Falha o pipeline se performance, acessibilidade, boas práticas ou SEO
      # ficarem abaixo de 90 (metas em lighthouserc.json).
      - run: npm run lighthouse

      - name: Publicar relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Liberar deploy na Cloudflare
    needs: [quality, lighthouse]
    # Só a branch padrão vai para produção, e só com todos os checks verdes.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy hook da Cloudflare
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret CLOUDFLARE_DEPLOY_HOOK_URL não configurado; deploy não disparado."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
          echo "Deploy de produção solicitado à Cloudflare."
